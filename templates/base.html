<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('tasks.index') }}">{{ APP_NAME }}</a>
    <nav>
      <a href="{{ url_for('tasks.index') }}">任务列表</a>
      <a class="btn btn-primary" href="{{ url_for('tasks.create') }}">＋ 新建任务</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, msg in messages %}
            <div class="flash flash-{{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>StudyTask · 软件工程实验一 · 数据保存在本地 SQLite 数据库</span>
  </footer>
</body>
</html>
